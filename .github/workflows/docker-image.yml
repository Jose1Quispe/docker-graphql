name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Docker login
      env:
        DOCKER_USER: ${{secrets.DOCKER_USER }}
        DOCKER_PASSWORD: ${{secrets.DOCKER_PASSWORD }}
      run: 
          echo "Iniciando login"
          docker login -u $DOCKER_USER -p $DOCKER_PASSWORD
          echo "Fin de login"

    - name: Build Docker Image #"construir imagen"
      run: 
        docker build -t joselqv202/docker-graphql:0.0.2 .
    - name: push Docker Image #"subir la imagen"
      run: 
        docker push -t joselqv202/docker-graphql:0.0.2 .
        
    
        
    
   
